version: '3.8'

services:
  bot:
    build: .
    container_name: budget_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Логи сохраняются на хосте
      - ./logs:/app/logs
      # Google credentials (только чтение)
      - ./google_credentials.json:/app/google_credentials.json:ro
    environment:
      - TZ=Europe/Minsk
    # Ограничение ресурсов
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    # Healthcheck
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
