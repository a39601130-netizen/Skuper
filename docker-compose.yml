services:
  budget_postgres:
    image: postgres:16-alpine
    container_name: budget_postgres
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: budget_bot
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Europe/Minsk
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - budget_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

  budget_bot:
    build: .
    container_name: budget_bot
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./google_credentials.json:/app/google_credentials.json:ro
    environment:
      TZ: Europe/Minsk
      DATABASE_URL: postgresql+asyncpg://budget:${DB_PASSWORD}@budget_postgres:5432/budget_bot
    expose:
      - "8000"
    depends_on:
      budget_postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - budget_net
      - lila_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 256M

networks:
  budget_net:
    driver: bridge
  lila_net:
    name: lila_bot_default

volumes:
  postgres_data:
