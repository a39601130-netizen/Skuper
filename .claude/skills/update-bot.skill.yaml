name: update-bot
description: Коммит + push + пересборка Docker на сервере
instructions: |
  Обновляет бота на сервере: коммит, push, docker rebuild.

  1. ПРОВЕРКА CLAUDE.md:
     - Прочитай CLAUDE.md и проверь, отражает ли он текущее состояние
     - Если изменения затрагивают структуру/API/модели — обнови CLAUDE.md

  2. КОММИТ:
     - `git status` и `git diff` — проверь изменения
     - Если есть — `git add` нужные файлы + `git commit`
     - Если нет изменений — СТОП, ничего не делать

  3. ПУШ:
     - `git push`

  4. ДЕПЛОЙ НА СЕРВЕР:
     - `ssh bot "cd ~/Artur/Skuper && git pull && docker compose up --build -d"`

  5. ПРОВЕРКА (через 5 сек):
     - `ssh bot "cd ~/Artur/Skuper && docker compose ps"`
     - Контейнер budget_bot должен быть Up + (healthy)
     - Если не healthy — смотри логи: `ssh bot "cd ~/Artur/Skuper && docker compose logs --tail=30 budget_bot"`

  ВАЖНО:
  - Используй TodoWrite для отслеживания прогресса
  - Если контейнер в crash loop — смотри логи и исправляй
