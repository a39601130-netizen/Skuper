name: migrate-to-pg
description: Одноразовая миграция Google Sheets -> PostgreSQL
instructions: |
  Миграция данных из Google Sheets в PostgreSQL. Выполнять ОДИН раз!

  1. ПРОВЕРИТЬ ГОТОВНОСТЬ:
     - `ssh bot "cd ~/Artur/Skuper && docker compose ps budget_postgres"`
     - Должен быть healthy

  2. ЗАПУСТИТЬ:
     - `ssh bot "cd ~/Artur/Skuper && docker compose exec budget_bot python scripts/migrate_sheets_to_pg.py"`

  3. ПРОВЕРИТЬ:
     - В выводе: "Мигрировано X транзакций", "Мигрировано X тренировок"
     - `curl https://budget-bot.duckdns.org/api/health`

  ВАЖНО: Скрипт идемпотентный (проверяет дубли по дате+сумме)
