name: start-local
description: Запуск budget_bot локально для тестирования
instructions: |
  Запускает budget_bot локально. ТОЛЬКО по явной команде пользователя.

  1. ПРОВЕРИТЬ ЗАПУЩЕННЫЕ ПРОЦЕССЫ:
     - `tasklist 2>/dev/null | grep python || ps aux 2>/dev/null | grep "python run.py" | grep -v grep`
     - Если бот уже запущен — спросить, перезапустить ли

  2. ЗАПУСТИТЬ В ФОНЕ (run_in_background=true):
     - `cd /f/budget_bot && ./venv/Scripts/python.exe run.py`

  3. ПРОВЕРИТЬ (через 5 сек):
     - Логи фонового процесса должны содержать "Bot polling started" и "FastAPI server starting"

  ВАЖНО:
  - Entry point: `run.py` (НЕ main.py)
  - .env и google_credentials.json должны быть на месте
  - При ошибках импорта: `./venv/Scripts/pip install -r requirements.txt`
