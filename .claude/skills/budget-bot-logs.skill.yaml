name: budget-bot-logs
description: Просмотр логов budget_bot на сервере
instructions: |
  Показывает логи и статус budget_bot на сервере.

  1. СТАТУС:
     - `ssh bot "cd ~/Artur/Skuper && docker compose ps"`

  2. ЛОГИ (последние 50 строк):
     - `ssh bot "cd ~/Artur/Skuper && docker compose logs --tail=50 budget_bot"`

  3. АНАЛИЗ:
     - Выдели ошибки (ERROR, Exception, Traceback)
     - Если всё чисто — скажи что логи ок
