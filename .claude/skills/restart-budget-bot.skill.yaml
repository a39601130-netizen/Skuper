name: restart-budget-bot
description: Перезапуск budget_bot на сервере без пересборки
instructions: |
  Перезапускает budget_bot контейнер без пересборки образа.

  1. ПЕРЕЗАПУСК:
     - `ssh bot "cd ~/Artur/Skuper && docker compose restart budget_bot"`

  2. ПРОВЕРКА (через 5 сек):
     - `ssh bot "cd ~/Artur/Skuper && docker compose ps"`
     - `ssh bot "cd ~/Artur/Skuper && docker compose logs --tail=15 budget_bot"`
     - Должен быть Up + (healthy)

  3. Если ошибка — показать логи с `--tail=50`
